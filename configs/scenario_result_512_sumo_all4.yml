# General simulation settings
# variables:
#   &user_timesteps 18400

accel_settings:
  intra_map:
    trim_threshold: 180
    trim_grace_period: 180
    time_delta_threshold: 100
  inter_map:
    trim_grace_period: 100


general:
  USER_TIMESTEPS: 25200       # Number of user timesteps
  DATA_SOURCE: "scenario_sumo"
  SNIFFER_DATA_SOURCE: "scenario_result_512_sumo_all4"
  MAPPING_SOURCE: "scenario_result_512_sumo_all4"
  IDENTIFIER_LENGTH: 6
  ID_RANDOMIZATION: uniform
  ID_TRANSMISSION: exponential
  LTE_RANDOMIZATION_MODE: "time"

user_threshold:
  TOTAL_NUMBER_OF_USERS: 512          # Create only same set of users for different run

movement_parameters:
  POLYGON_COORDS:                     # Polygon coordinates
    - [3499.77, 1500.07]
    - [5798.43, 3799.93]
    - [6452.11, 3150.56]
    - [5401.44, 2099.71]
    - [5751.91, 1749.63]
    - [4500.10, 498.92]

# Randomization Intervals
randomization_intervals:
  # Bluetooth IDs refresh range uniform (in seconds)
  BLUETOOTH_MIN_REFRESH: 180
  BLUETOOTH_MAX_REFRESH: 300

  # WiFi ID refresh range uniform (in seconds)
  WIFI_MIN_REFRESH: 1
  WIFI_MAX_REFRESH: 60

  # LTE refresh range uniform (in seconds)
  LTE_MIN_REFRESH: 240
  LTE_MAX_REFRESH: 720

#Transmission Intervals
transmission_intervals:
  # Bluetooth IDs transmit range uniform (in seconds)
  BLUETOOTH_MIN_TRANSMIT: 1
  BLUETOOTH_MAX_TRANSMIT: 10

  # WiFi ID transmit range uniform (in seconds)
  WIFI_MIN_TRANSMIT: 1
  WIFI_MAX_TRANSMIT: 60

  # LTE transmit range uniform (in seconds)
  LTE_MIN_TRANSMIT: 1
  LTE_MAX_TRANSMIT: 10

# Range for communication protocols
communication_range:
  BLUETOOTH_RANGE: 30                # Bluetooth range (in meters)
  WIFI_RANGE: 60                     # WiFi range (in meters)
  LTE_RANGE: 100                     # LTE range (in meters)

# Localization errors
localization_errors:
  BLUETOOTH_LOCALIZATION_ERROR: 1    # Bluetooth localization error (in meters)
  WIFI_LOCALIZATION_ERROR: 5         # WiFi localization error (in meters)
  LTE_LOCALIZATION_ERROR: 10         # LTE localization error (in meters)

smart:
  ENABLE_SMART_TRACKING: true

# Mobility settings
mobility:
  MAX_MOBILITY_FACTOR: 1.5       # Mobility factor in m/s
# Sniffer settings
sniffer:
  GENERATE_SNIFFER_DATA: true
  ENABLE_PARTIAL_COVERAGE: false
  ENABLE_MULTILATERATION: false
  ENABLE_BLUETOOTH: true       # Enable Bluetooth
  ENABLE_WIFI: false           # Enable Bluetooth
  ENABLE_LTE: true             # Enable Bluetooth
  TRANSMIT_WHEN_RANDOMIZED: false
  SNIFFER_PROCESSING_BATCH_SIZE: 100 # Sniffer processing batch size
