[project]
name = "privacy_analysis"
version = "0.1.0"
description = "CrossLink: Breaking Location Privacy by Linking Device Identifiers Across Protocols"
requires-python = ">=3.10"
dependencies = [
    "libsumo>=1.20.0",
    "shapely>=2.0.4",
    "orjson>=3.10.4",
    "polars>=0.20.31",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "pymongo>=4.7.3",
    "loguru>=0.7.2",
    "matplotlib>=3.9.0",
    "PyYAML>=6.0.1",
    "invoke>=2.2.0",
    "pyshark>=0.6",
    "seaborn>=0.13.2",
    "networkx>=3.4.2",
    "tk>=0.1.0",
    "tqdm>=4.67.1",
    "pyarrow>=18.1.0",
    "scikit-learn>=1.6.1",
    "alphashape>=1.3.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
