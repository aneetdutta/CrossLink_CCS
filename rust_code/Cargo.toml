cargo-features = ["edition2024"]
[package]
name = "pathleak-rust"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
csv = "1.4.0"
yaml-rust2 = "0.10.4"
rayon = "1.10.0"
binrw = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["use-std"] }
itertools = "0.14.0"
rand = "0.9.2"
regex = "1.12.2"
rand_distr = "0.5"

[features]
intra_map_disable_trim = []
intra_map_report_wrong_pairs = []
inter_map_disable_trim = []
